[project]
name = "maritime-alerts"
version = "0.1.0"
description = "Space-to-Sea hackathon — maritime alerts module"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
    "geopy>=2.4",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
]

[project.scripts]
maritime-alerts = "maritime_alerts:main"

[dependency-groups]
dev = [
    "notebook>=7.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
